<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/_sdk/ui.css" />
</head>
<body>
  <div class="nh-page">
    <div class="nh-toolbar">
      <button id="go" class="primary">统计</button>
      <span class="nh-spacer"></span>
      <button id="clear" class="small">清空</button>
    </div>
    <section class="nh-pane" style="flex:1">
      <header class="nh-pane-head"><span>输入文本</span></header>
      <textarea id="text" class="nh-pane-body" spellcheck="false" placeholder="粘贴或输入文本"></textarea>
    </section>
    <div id="result" class="nh-status">由 Python 后端统计</div>
  </div>
  <script src="/_sdk/ui.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    $('go').onclick = async function () {
      try {
        var r = await nuthusk.call('count', { text: $('text').value });
        $('result').className = 'nh-status ok';
        $('result').textContent = r.chars + ' 字符 · ' + r.words + ' 个单词 · ' + r.lines + ' 行 · ' + r.bytes + ' 字节';
      } catch (e) {
        $('result').className = 'nh-status err';
        $('result').textContent = e.message;
      }
    };
    $('clear').onclick = function () { $('text').value = ''; $('result').className = 'nh-status'; $('result').textContent = '已清空'; };
  </script>
</body>
</html>
