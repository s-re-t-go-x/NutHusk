<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/_sdk/ui.css" />
</head>
<body>
  <div class="nh-page">
    <div class="nh-toolbar">
      <button id="go" class="primary">生成</button>
      <label>数量 <input id="n" type="number" min="1" max="500" value="5" style="width:80px" /></label>
      <label><input id="upper" type="checkbox" /> 大写</label>
      <span class="nh-spacer"></span>
      <button id="copy" class="small">复制全部</button>
    </div>
    <section class="nh-pane" style="flex:1">
      <header class="nh-pane-head"><span>结果</span></header>
      <textarea id="out" class="nh-pane-body mono" readonly></textarea>
    </section>
    <div id="status" class="nh-status">纯前端插件：没有后端进程，也不需要任何权限</div>
  </div>
  <script src="/_sdk/ui.js"></script>
  <script>
    // getRandomValues 在任何环境都可用（randomUUID 需要安全上下文，沙箱 iframe 里不一定有）
    function uuid() {
      var b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
    }
    function run() {
      var n = Math.max(1, Math.min(500, parseInt(document.getElementById('n').value, 10) || 1));
      var list = [];
      for (var i = 0; i < n; i++) list.push(uuid());
      var text = list.join('\n');
      document.getElementById('out').value = document.getElementById('upper').checked ? text.toUpperCase() : text;
    }
    document.getElementById('go').onclick = run;
    document.getElementById('copy').onclick = function () {
      var out = document.getElementById('out'); out.focus(); out.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      out.setSelectionRange(0, 0);
      var s = document.getElementById('status'); s.className = 'nh-status ' + (ok ? 'ok' : ''); s.textContent = ok ? '已复制' : '复制失败，请手动选中后按 Ctrl+C';
    };
    run();
  </script>
</body>
</html>
