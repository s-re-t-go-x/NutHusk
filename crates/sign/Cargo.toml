[package]
name = "nuthusk-sign"
version = "0.1.0"
edition = "2021"
description = "NutHusk 插件签名工具：生成密钥、给审查过的插件包签名、验证签名"

[[bin]]
name = "nuthusk-sign"
path = "src/main.rs"

[dependencies]
nuthusk-core = { path = "../core" }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
