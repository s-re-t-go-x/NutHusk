[package]
name = "nuthusk-cli"
version = "0.1.0"
edition = "2021"
description = "NutHusk 开发者与签名命令行工具：插件脚手架、协议校验、无头运行、打包、密钥生成与签名验证"

[[bin]]
name = "nuthusk-cli"
path = "src/main.rs"

[dependencies]
nuthusk-core = { path = "../core" }
serde_json = "1"
url = "2"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
