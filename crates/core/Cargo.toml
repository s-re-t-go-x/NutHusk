[package]
name = "nuthusk-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
